# Host-side client config for the TENANT listener.
# Connect by setting bootstrap.servers to <tenant>.kafka1:14091 - the SNI carries
# the tenant ID into the broker's MultiTenantInterceptor.
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
# Truststore is on the host filesystem (mounted into the broker via ./scripts/security)
ssl.truststore.location=/Users/prabhashkr/workspace/confluentinc/cp-demo/scripts/security/kafka.kafka1.truststore.jks
ssl.truststore.password=confluent
# Broker cert's CN is "kafka1" - disable hostname verification so the client
# accepts it when connecting as lkc-test1.kafka1.
ssl.endpoint.identification.algorithm=
# Fetch a bearer token from MDS (HTTPS on the host-published 8091 port)
sasl.login.callback.handler.class=io.confluent.kafka.clients.plugins.auth.token.TokenUserLoginCallbackHandler
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required username="superUser" password="superUser" metadataServerUrls="https://kafka1:8091,https://kafka2:8092";
