# In-container client config for the TENANT listener (use this via `docker exec kafka1 ...`).
# For host-side testing use client-tenant-host.properties instead - the truststore path here is
# the container path (./scripts/security is bind-mounted at /etc/kafka/secrets), not the host path.
#
# Connect by setting bootstrap.servers to <tenant>.kafka1:14091 - the SNI carries
# the tenant ID into the broker's MultiTenantInterceptor. The tenant hostname must resolve
# to the broker's own container IP from inside the container (docker's DNS fallback resolves
# it to 127.0.0.1 via the host's /etc/hosts otherwise, which won't reach the TENANT listener):
#   docker exec -u root kafka1 bash -c "echo '<kafka1-container-ip> lkc-test1.kafka1' >> /etc/hosts"
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
ssl.truststore.location=/etc/kafka/secrets/kafka.kafka1.truststore.jks
ssl.truststore.password=confluent
# Broker cert's CN is "kafka1" - disable hostname verification so the client
# accepts it when connecting as lkc-test1.kafka1.
ssl.endpoint.identification.algorithm=
# Fetch a bearer token from MDS (HTTPS on the host-published 8091 port)
sasl.login.callback.handler.class=io.confluent.kafka.clients.plugins.auth.token.TokenUserLoginCallbackHandler
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required username="superUser" password="superUser" metadataServerUrls="https://kafka1:8091,https://kafka2:8092";