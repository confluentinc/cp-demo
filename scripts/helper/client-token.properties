# In-container client config for the TOKEN listener, e.g.:
#   docker exec kafka1 kafka-topics --bootstrap-server kafka1:10091 \
#     --command-config /tmp/helper/client-token.properties --list
bootstrap.servers=kafka1:10091,kafka2:10092
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
# /etc/kafka/secrets is where ./scripts/security is bind-mounted inside the kafka1/kafka2 containers
ssl.truststore.location=/etc/kafka/secrets/kafka.kafka1.truststore.jks
ssl.truststore.password=confluent
sasl.login.callback.handler.class=io.confluent.kafka.clients.plugins.auth.token.TokenUserLoginCallbackHandler
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required username="superUser" password="superUser" metadataServerUrls="https://kafka1:8091,https://kafka2:8092";
